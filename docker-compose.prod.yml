services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  web:
    build:
      context: .
      target: production
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - staticfiles:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      - web
    restart: unless-stopped

  celery:
    build:
      context: .
      target: production
    command: uv run celery -A config worker -l warning --concurrency 4
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  celery-beat:
    build:
      context: .
      target: production
    command: uv run celery -A config beat -l warning
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    restart: unless-stopped
    depends_on:
      - redis

volumes:
  postgres_data:
  redis_data:
  staticfiles:
  media_data:
