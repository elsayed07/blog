[project]
name = "blog"
version = "0.1.0"
description = "Professional blog platform"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "celery[redis]>=5.4",
    "django-environ>=0.11",
    "whitenoise>=6.8",
    "gunicorn>=23.0",
    "django-ninja>=1.3",
    "django-taggit>=6.1",
    "markdown>=3.7",
    "bleach>=6.2",
    "Pillow>=11.1",
    "django-imagekit>=5.0",
    "django-extensions>=3.2",
    "structlog>=24.4",
    "sentry-sdk[django]>=2.20",
    "django-storages[s3]>=1.14",
    "django-cors-headers>=4.6",
    "django-ratelimit>=4.1",
    "django-cacheops>=7.1",
    "factory-boy>=3.3",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "pytest-asyncio>=0.24",
    "faker>=33.0",
    "ruff>=0.9",
    "black>=24.10",
    "pyright>=1.1",
    "pre-commit>=4.0",
    "django-debug-toolbar>=4.4",
    "ipython>=8.30",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "faker>=33.0",
    "ruff>=0.9",
    "black>=24.10",
    "pyright>=1.1",
    "pre-commit>=4.0",
    "django-debug-toolbar>=4.4",
    "ipython>=8.30",
]

[tool.ruff]
target-version = "py313"
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "ANN", "S", "B", "A", "C4", "DTZ", "T20", "ARG", "RET", "SIM", "TID", "TCH", "ERA", "PL", "RUF"]
ignore = ["ANN101", "ANN102", "ANN401", "S101", "PLR0913", "RUF012"]

[tool.ruff.per-file-ignores]
"*/migrations/*" = ["ALL"]
"*/tests/*" = ["ANN", "S", "ARG"]
"config/settings/*" = ["F405", "F403"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
djangoVersion = "5.2"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--reuse-db -x -q"

[tool.coverage.run]
source = ["."]
omit = ["*/migrations/*", "*/tests/*", "config/*", "manage.py"]
